spring.application.name=invoice-service


server.port=8081


# =====================================================
# MYSQL DATABASE CONFIGURATION
# =====================================================
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://host.docker.internal:3306/invoice_db
spring.datasource.username=root
spring.datasource.password=199505


# =====================================================
# JPA / HIBERNATE CONFIGURATION
# =====================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ================================
# ACTUATOR
# ================================

# Expose actuator endpoints
management.endpoints.web.exposure.include=health,info,metrics,beans,mappings,env,loggers

# Show detailed health information
management.endpoint.health.show-details=always

# Actuator base path
management.endpoints.web.base-path=/actuator

# Redis caching
spring.cache.type=redis
spring.cache.redis.time-to-live=10m

# Redis connection
spring.data.redis.host=pleased-ape-218173.upstash.io
spring.data.redis.port=6379
spring.data.redis.username=default
spring.data.redis.password=gQAAAAAAA1Q9AAIgcDI5ODE1N2UyNDJkOWU0MTA2OTVlZmE0ZTg2YzhhYjFjNg
spring.data.redis.ssl.enabled=true



# Eureka Client
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/



